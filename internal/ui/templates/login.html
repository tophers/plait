{{define "content"}}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required value="{{.Data.Username}}" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <label for="code">Authentication code</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" spellcheck="false">
    <p class="hint">From your authenticator app, if two-factor authentication is on for this account.</p>
    <button type="submit">Log in</button>
  </form>
</section>
{{end}}
